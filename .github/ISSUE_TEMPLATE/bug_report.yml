name: Bug Report
description: Report a bug in plexus-typescript
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: package-version
    attributes:
      label: Package Version
      description: Version of plexus-typescript (`npm ls plexus-typescript`)
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime Version
      description: Output of `node --version`, or the browser name/version for `plexus-typescript/browser`
      placeholder: "v20.11.0"
    validations:
      required: true

  - type: dropdown
    id: entry-point
    attributes:
      label: Entry Point
      description: Which part of the SDK is affected?
      options:
        - plexus-typescript (Node client)
        - plexus-typescript/server (ingest proxy)
        - plexus-typescript/browser (browser client)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      description: Minimal code to reproduce the issue
      render: typescript
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Any relevant error output
      render: text
