name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What problem does this feature solve? What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Include example code if applicable.
      render: typescript

  - type: checkboxes
    id: area
    attributes:
      label: Related Area
      description: Which part of the SDK does this relate to?
      options:
        - label: Core client (send / event / sendBatch / run)
        - label: Reliability (retry, buffering)
        - label: Server ingest proxy
        - label: Browser client
        - label: Transport (WebSocket, streaming)
        - label: Config / environment
        - label: Types / DX

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this to your project?
      options:
        - Nice to have
        - Important — working around it today
        - Critical — blocking my project
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to submit a PR for this feature
